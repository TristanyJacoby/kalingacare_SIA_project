<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KalingaCare | Admin Products</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>

<body class="admin-body">
  <!-- Shown if the logged-in user's role is below "staff" -->
  <div class="container access-denied" id="accessDenied" style="display:none;">
    <i class="bi bi-shield-lock"></i>
    <h3>You don't have access to this page</h3>
    <p class="text-muted">This area is restricted to KalingaCare staff.</p>
    <a href="../index.html" class="hero-btn-primary" style="text-decoration:none; display:inline-flex;">Back to Home</a>
  </div>

  <div class="admin-shell" id="adminShell" style="display:none;">
    <aside class="admin-sidebar">
      <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="" class="navbar-logo-img" /> KalingaCare</a>

      <ul class="admin-nav">
        <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li><a href="products.html" class="active"><i class="bi bi-box-seam"></i> Products</a></li>
        <li><a href="orders.html"><i class="bi bi-receipt"></i> Orders</a></li>
        <li><a href="../index.html"><i class="bi bi-arrow-left"></i> Back to Store</a></li>
      </ul>

      <div class="admin-sidebar-footer">
        <div class="admin-user-chip">
          <div class="avatar" id="adminAvatar">?</div>
          <div>
            <div class="name" id="adminName">—</div>
            <span class="role-badge" id="adminRole">—</span>
          </div>
        </div>
        <button type="button" class="remove-item" id="adminLogoutBtn"><i class="bi bi-box-arrow-right"></i> Log Out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Products</h1>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="admin-panel product-edit-only d-none">
            <h4 id="productFormTitle">Add Product</h4>
            <form class="admin-form" id="productForm">
              <input type="hidden" id="productEditingId" />
              <input type="text" id="pName" placeholder="Product name" required />
              <select id="pCategory" required>
                <option value="mobility">Mobility</option>
                <option value="wellness">Wellness</option>
                <option value="digital">Digital Health</option>
              </select>
              <input type="text" id="pSubcategory" placeholder="Subcategory (e.g. Walking Aids)" />
              <input type="number" id="pPrice" placeholder="Price (PHP)" min="0" required />
              <input type="number" id="pStock" placeholder="Stock quantity" min="0" />
              <input type="text" id="pImg" placeholder="Image path (e.g. assets/images/products/product1.jpg)" />
              <button type="submit" class="btn-success w-100">Save Product</button>
              <button type="button" class="remove-item d-none mt-2" id="cancelEditBtn">Cancel editing</button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="admin-panel">
            <h4>All Products</h4>
            <table class="admin-table" id="adminProductsTable">
              <thead>
                <tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>
              </thead>
              <tbody>
                <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/firebase.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
